<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizarding School - Character Creator</title>
    <link rel="stylesheet" href="css/character-creator.css">
</head>
<body>
    <header class="page-header">
        <h1>Create Your Wizard</h1>
        <p>Choose your name and appearance before beginning your journey</p>
    </header>

    <main class="creator-container">
        <!-- Preview Panel -->
        <aside class="preview-panel">
            <div class="preview-frame">
                <h2>Preview</h2>
                <div class="canvas-wrapper">
                    <canvas id="sprite-preview"></canvas>
                </div>
                <div class="char-name-display" id="name-display"></div>

                <div class="animation-controls">
                    <button class="anim-btn" id="btn-idle">Idle</button>
                    <button class="anim-btn" id="btn-walk">Walk</button>
                    <button class="anim-btn" id="btn-spellcast">Cast</button>
                </div>

                <div class="direction-controls">
                    <button class="dir-btn" id="btn-up" title="Face Up">&#9650;</button>
                    <button class="dir-btn" id="btn-left" title="Face Left">&#9664;</button>
                    <button class="dir-btn" id="btn-right" title="Face Right">&#9654;</button>
                    <button class="dir-btn" id="btn-down" title="Face Down">&#9660;</button>
                </div>
            </div>
        </aside>

        <!-- Options Panel -->
        <div class="options-panel">
            <!-- Name -->
            <section class="option-section name-section">
                <h3>Wizard Name</h3>
                <div class="option-row">
                    <label for="char-name">Full Name</label>
                    <input type="text" id="char-name" placeholder="Enter your wizard's name..." maxlength="40">
                </div>
            </section>

            <!-- Body -->
            <section class="option-section">
                <h3>Body</h3>
                <div class="option-row">
                    <label for="body-type">Build</label>
                    <select id="body-type"></select>
                </div>
                <div class="option-row">
                    <label for="skin-color">Skin Tone</label>
                    <select id="skin-color"></select>
                </div>
            </section>

            <!-- Hair -->
            <section class="option-section">
                <h3>Hair</h3>
                <div class="option-row">
                    <label for="hair-style">Style</label>
                    <select id="hair-style"></select>
                </div>
                <div class="option-row" id="hair-color-row">
                    <label for="hair-color">Color</label>
                    <select id="hair-color"></select>
                </div>
            </section>

            <!-- Top / Robes -->
            <section class="option-section">
                <h3>Robes &amp; Top</h3>
                <div class="option-row">
                    <label for="top-style">Style</label>
                    <select id="top-style"></select>
                </div>
                <div class="option-row" id="top-color-row">
                    <label for="top-color">Color</label>
                    <select id="top-color"></select>
                </div>
            </section>

            <!-- Legs -->
            <section class="option-section">
                <h3>Legs</h3>
                <div class="option-row">
                    <label for="leg-style">Style</label>
                    <select id="leg-style"></select>
                </div>
                <div class="option-row" id="leg-color-row">
                    <label for="leg-color">Color</label>
                    <select id="leg-color"></select>
                </div>
            </section>

            <!-- Footwear -->
            <section class="option-section">
                <h3>Footwear</h3>
                <div class="option-row">
                    <label for="footwear-style">Style</label>
                    <select id="footwear-style"></select>
                </div>
                <div class="option-row" id="shoe-color-row">
                    <label for="shoe-color">Color</label>
                    <select id="shoe-color"></select>
                </div>
            </section>

            <!-- Headwear -->
            <section class="option-section">
                <h3>Headwear</h3>
                <div class="option-row">
                    <label for="headwear-style">Style</label>
                    <select id="headwear-style"></select>
                </div>
                <div class="option-row" id="hat-color-row">
                    <label for="hat-color">Color</label>
                    <select id="hat-color"></select>
                </div>
            </section>

            <!-- Cape -->
            <section class="option-section">
                <h3>Cape</h3>
                <div class="option-row">
                    <label for="cape-style">Style</label>
                    <select id="cape-style"></select>
                </div>
                <div class="option-row" id="cape-color-row">
                    <label for="cape-color">Color</label>
                    <select id="cape-color"></select>
                </div>
            </section>

            <!-- Actions -->
            <div class="actions">
                <button class="btn-secondary" id="btn-randomize">Randomize</button>
                <button class="btn-primary" id="btn-confirm">Begin Your Journey</button>
            </div>
        </div>
    </main>

    <!-- Confirmation Overlay -->
    <div id="confirm-panel"></div>

    <script src="js/sprite-renderer.js"></script>
    <script src="js/character-creator.js"></script>
</body>
</html>
